[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-strategy-agent"
version = "1.1.0"
description = "Проверяемые продуктовые и коммуникационные решения с памятью и OpenRouter"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strategy-agent = "strategy_agent.cli:main"

[tool.setuptools.packages.find]
include = ["strategy_agent*"]
